<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Formula Simulator</title>
<style>
:root{--bg:#0c1116;--pn:#121a22;--ln:#1f2b36;--tx:#d5dde5;--mu:#7d8b99;--g:#2ebd85;--r:#f6465d;--y:#f0b90b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
header b{margin-right:auto;font-size:16px}
select,input,button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:7px 10px;font:inherit}
input{width:110px}button{cursor:pointer}#go{background:var(--g);color:#04130c;border-color:var(--g);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--y)}
#st{padding:6px 12px;color:var(--mu);min-height:30px}
main{display:grid;grid-template-columns:1fr 270px;gap:1px;background:var(--ln)}
#c{height:62vh;background:var(--bg)}#pn{background:var(--pn);padding:12px}#pn p{margin:5px 0;display:flex;justify-content:space-between;gap:8px}
#pn h3{margin:0 0 8px;font-size:20px}.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mu)}
section{padding:12px;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:420px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
@media(max-width:800px){main{grid-template-columns:1fr}#c{height:55vh}}
</style></head><body>
<header><b>BTC/USDT formula simulator</b>
<select id="mode" aria-label="Mode"><option value="1h">1 hour</option><option value="1m">1 minute</option></select>
<input id="x" type="number" value="2" min="0.05" step="0.05" aria-label="x percent, fixed"><span class="m">x % (fixed)</span>
<input id="amt" type="number" value="1000" min="1" aria-label="Start amount"><span class="m">USDT</span>
<button id="go">Start</button><button id="rs">Reset</button></header>
<div id="st">Enter a start amount and press Start. Simulation only, no real orders.</div>
<main><div id="c"></div><aside id="pn"></aside></main>
<section><table id="tr"></table></section>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="sim.js?v=6"></script>
<script>
const $=i=>document.getElementById(i),LS="btcsim5",f=(x,n=2)=>x.toLocaleString("en",{minimumFractionDigits:n,maximumFractionDigits:n}),sg=x=>(x>=0?"+":"")+f(x),cl=x=>x>=0?"g":"r";
let d=null,K=[],R=null,live=0,ws=null;
const say=t=>$("st").textContent=t;
const ch=LightweightCharts.createChart($("c"),{autoSize:true,layout:{background:{color:"#0c1116"},textColor:"#9aa7b4"},grid:{vertLines:{color:"#161f28"},horzLines:{color:"#161f28"}},timeScale:{timeVisible:true,secondsVisible:false},rightPriceScale:{borderColor:"#1f2b36"}});
const cs=ch.addCandlestickSeries({upColor:"#2ebd85",downColor:"#f6465d",borderVisible:false,wickUpColor:"#2ebd85",wickDownColor:"#f6465d"});
async function start(){const amt=+$("amt").value,X=+$("x").value,demo=$("mode").value=="1m";if(!(amt>0&&X>0))return say("Enter a start amount and x% above zero.");
say("Reading the BTC price...");try{const iv=demo?"1m":"1h",ms=demo?6e4:36e5,sh=Math.floor(Date.now()/ms)*ms;
const tk=await SIM.get("/api/v3/ticker/price?symbol=BTCUSDT");d={iv,ms,sh,p0:+tk.price,amt,X};localStorage[LS]=JSON.stringify(d);go()}catch(e){say("Could not start ("+(e&&e.message||e)+"). Check the connection and press Start again.")}}
async function go(){d=d||JSON.parse(localStorage[LS]);$("amt").value=d.amt;$("x").value=d.X;$("mode").value=d.iv;$("mode").disabled=$("amt").disabled=$("x").disabled=true;$("go").disabled=true;
try{await load();connect()}catch(e){say("Could not load data. Reload the page to retry.")}}
async function load(){K=await SIM.klines(d.iv,d.ms,d.sh-(200+SIM.VW)*d.ms);draw()}
function draw(){R=SIM.series(K,d);cs.setData(K.map(x=>({time:x.t,open:x.o,high:x.h,low:x.l,close:x.c})));
table();panel()}
function connect(){if(ws)ws.close();ws=new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${d.iv}`);
ws.onmessage=async m=>{const k=JSON.parse(m.data).k;live=+k.c;cs.update({time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c});if(k.x){try{await load()}catch(e){}}else panel()};
ws.onclose=()=>setTimeout(()=>d&&connect(),3000)}
$("go").onclick=start;$("rs").onclick=()=>{localStorage.removeItem(LS);location.reload()};
if(localStorage[LS])go();
</script><script src="ui2.js?v=6"></script></body></html>
