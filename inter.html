<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INTER/BTC ratio simulator</title>
<style>
:root{--bg:#0c1116;--pn:#121a22;--ln:#1f2b36;--tx:#d5dde5;--mu:#7d8b99;--g:#2ebd85;--r:#f6465d;--y:#f0b90b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
header b{margin-right:auto;font-size:16px}header a{color:var(--y)}
select,input,button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:7px 10px;font:inherit}
input{width:84px}button{cursor:pointer}#go{background:var(--g);color:#04130c;border-color:var(--g);font-weight:600}
#st{padding:6px 12px;color:var(--mu);min-height:30px}
main{display:grid;grid-template-columns:1fr 300px;gap:1px;background:var(--ln)}
#c{height:46vh;background:var(--bg)}#c2{height:22vh;background:var(--bg);border-top:1px solid var(--ln)}#pn{background:var(--pn);padding:12px}#pn p{margin:5px 0;display:flex;justify-content:space-between;gap:8px}
#pn h3{margin:0 0 8px;font-size:20px}.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mu)}
section{padding:12px;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body>
<header><b>INTER/BTC ratio simulator</b><a href="index.html">BTC sim</a>
<select id="ex" aria-label="Exchange"><option value="auto">Auto exchange</option><option value="mexc">MEXC</option><option value="gate">Gate</option><option value="bybit">Bybit</option></select>
<select id="iv" aria-label="Timeframe"><option>1m</option><option>5m</option><option>15m</option><option>1h</option></select>
<input id="x" type="number" value="2" min="0.05" step="0.05" aria-label="x percent"><span class="m">x %</span>
<input id="amt" type="number" value="100" min="1" aria-label="Start amount"><span class="m">USDT</span>
<button id="go">Start</button><button id="rs">Reset</button></header>
<div id="st">Rule: R = INTER price ÷ BTC price. When R rises x% from the last signal: LONG INTER. When R falls x%: SHORT INTER. Simulation only, no real orders.</div>
<main><div><div id="c"></div><div id="c2"></div></div><aside id="pn"></aside></main>
<section><table id="tr"></table></section>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="inter.js"></script>
<script>
const $=i=>document.getElementById(i),LS="intersim1",f=(x,n=2)=>x.toLocaleString("en",{minimumFractionDigits:n,maximumFractionDigits:n}),sg=x=>(x>=0?"+":"")+f(x),cl=x=>x>=0?"g":"r",q4=x=>x>=100?f(x,2):x.toFixed(4),pf=x=>x<1?x.toFixed(5):f(x,4),rf=x=>x.toExponential(4);
const say=t=>$("st").textContent=t;
let d=null,R=null,GB=[],KI=[],pi=0,pb=0,timer=null,loading=false,PL=[],PL2=[];
const opt={autoSize:true,layout:{background:{color:"#0c1116"},textColor:"#9aa7b4"},grid:{vertLines:{color:"#161f28"},horzLines:{color:"#161f28"}},timeScale:{timeVisible:true,secondsVisible:false},rightPriceScale:{borderColor:"#1f2b36"}};
const ch=LightweightCharts.createChart($("c"),opt),ch2=LightweightCharts.createChart($("c2"),opt);
const cs=ch.addCandlestickSeries({upColor:"#2ebd85",downColor:"#f6465d",borderVisible:false,wickUpColor:"#2ebd85",wickDownColor:"#f6465d",priceFormat:{type:"price",precision:5,minMove:0.00001}});
const rl=ch2.addLineSeries({color:"#f0b90b",lineWidth:2,priceLineVisible:false,priceFormat:{type:"custom",formatter:x=>x.toExponential(3),minMove:1e-12}});
async function start(){const amt=+$("amt").value,X=+$("x").value;if(!(amt>0&&X>0))return say("Enter an amount and x% above zero.");
say("Reading INTER and BTC prices...");const sel=$("ex").value,r=await INT.detect(sel=="auto"?["mexc","gate","bybit"]:[sel]);
if(!r.ex)return say("No exchange returned both INTER and BTC prices. "+r.errs.join(" | "));
d={iv:$("iv").value,X,amt,ts:Date.now(),pi0:r.pi,pb0:r.pb,ex:r.ex};localStorage[LS]=JSON.stringify(d);go()}
async function go(){d=d||JSON.parse(localStorage[LS]);INT.ex=d.ex||"mexc";$("ex").value=d.ex||"mexc";$("iv").value=d.iv;$("x").value=d.X;$("amt").value=d.amt;["ex","iv","x","amt","go"].forEach(i=>$(i).disabled=true);
try{await load();if(timer)clearInterval(timer);timer=setInterval(tick,3000)}catch(e){say("Could not load data from "+INT.V[INT.ex].name+" ("+e+"). Reload the page to retry.")}}
async function load(){if(loading)return;loading=true;try{const ms=INT.IV[d.iv][1],first=Math.ceil(d.ts/ms)*ms,from=first-40*ms;
const [a,b]=await Promise.all([INT.klines("INTERUSDT",d.iv,from),INT.klines("BTCUSDT",d.iv,first-ms)]);KI=a;GB=INT.grid(a,b,d.pi0,d.pb0,first,ms,Date.now());
R=INT.run(GB,d.pi0/d.pb0,d.amt,d.X);R.first=first;pi=pi||d.pi0;pb=pb||d.pb0;draw()}finally{loading=false}}
function draw(){const ms=INT.IV[d.iv][1],first=R.first,gm=new Map(GB.map(b=>[b.t,b]));
const cd=KI.filter(x=>x.t<first).map(x=>({time:x.t/1e3,open:x.o,high:x.h,low:x.l,close:x.c})).concat(GB.map(b=>({time:b.t/1e3,open:b.o,high:b.h,low:b.l,close:b.c})));
KI.filter(x=>x.t>=first&&!gm.has(x.t)).forEach(x=>cd.push({time:x.t/1e3,open:x.o,high:x.h,low:x.l,close:x.c}));cd.sort((a,b)=>a.time-b.time);cs.setData(cd);
rl.setData([{time:Math.floor(d.ts/ms)*ms/1e3,value:d.pi0/d.pb0}].concat(GB.map(b=>({time:b.t/1e3,value:b.pi/b.pb}))).filter((v,i,a)=>!i||v.time>a[i-1].time));
const mk=[{time:Math.floor(d.ts/ms)*ms/1e3,position:"inBar",shape:"circle",color:"#f0b90b",text:"START"}];
R.ev.forEach(e=>{if(e.k=="out")mk.push({time:e.t/1e3,position:e.side>0?"aboveBar":"belowBar",shape:"circle",color:e.pnl>=0?"#2ebd85":"#f6465d",text:"EXIT "+sg(e.pnl)});
else mk.push({time:e.t/1e3,position:e.side>0?"belowBar":"aboveBar",shape:e.side>0?"arrowUp":"arrowDown",color:e.side>0?"#2ebd85":"#f6465d",text:(e.side>0?"LONG ":"SHORT ")+(e.n>1?"+"+e.n:"")})});
mk.sort((a,b)=>a.time-b.time);cs.setMarkers(mk);panel()}
async function tick(){if(!d)return;try{const [a,b]=await Promise.all([INT.price("INTERUSDT"),INT.price("BTCUSDT")]);pi=a;pb=b}catch(e){return}
const ms=INT.IV[d.iv][1],last=GB.length?GB[GB.length-1].t:R.first-ms;if(Date.now()>=last+2*ms)load().catch(()=>{});else panel()}
function mvS(e,x){return R.side>0?x/e-1:1-x/e}
function panel(){if(!R)return;const A=d.amt,x=pi||d.pi0,L=R.side>0,Rn=x/(pb||d.pb0),dr=(Rn-R.rp)/R.rp*100,F=INT.F;
const op=R.side?R.ent.reduce((a,e)=>a+A/e*(L?x-e:e-x),0)-F*A*R.ent.reduce((a,e)=>a+x/e,0):0,qt=R.ent.reduce((a,e)=>a+A/e,0),val=R.bal+op,pl=val-A,
W=R.ev.filter(e=>e.k=="out"&&e.pnl>=0).length,Ls=R.ev.filter(e=>e.k=="out"&&e.pnl<0).length,Ru=R.rp*(1+d.X/100),Rd=R.rp*(1-d.X/100),pbv=pb||d.pb0;
PL.forEach(l=>cs.removePriceLine(l));PL=[];PL2.forEach(l=>rl.removePriceLine(l));PL2=[];
PL2.push(rl.createPriceLine({price:R.rp,color:"#7d8b99",lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"R prev"}),rl.createPriceLine({price:Ru,color:"#2ebd85",lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"LONG"}),rl.createPriceLine({price:Rd,color:"#f6465d",lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"SHORT"}));
if(R.side)PL.push(cs.createPriceLine({price:R.ent.reduce((a,e)=>a+e,0)/R.ent.length,color:op>=0?"#2ebd85":"#f6465d",lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"ENTRY, P/L "+sg(op)+" USDT"}));
$("pn").innerHTML=`<h3 class="${L?"g":R.side<0?"r":"m"}">${R.side?(L?"Long INTER ":"Short INTER ")+R.ent.length+"/"+INT.MAX:"Flat"}</h3>
<p class="m">${R.side?(L?"Bought":"Sold short")+" "+q4(qt)+" INTER in total. Each step = "+f(A)+" USDT at that moment's INTER price.":"No position. Waiting for R to move "+f(d.X)+"% from R previous."}</p>
${R.ent.map((e,i)=>`<p><span class="m">Step ${i+1}: ${q4(A/e)} INTER at</span>${pf(e)}<b class="${cl(A/e*(L?x-e:e-x))}">${sg(A/e*(L?x-e:e-x))} (${sg(mvS(e,x)*100)}%)</b></p>`).join("")}
<hr style="border:0;border-top:1px solid var(--ln)">
<p><span class="m">INTER price</span><b>${pf(x)}</b></p><p><span class="m">BTC price</span>${f(pbv)}</p>
<p><span class="m">R now (INTER÷BTC)</span>${rf(Rn)}</p><p><span class="m">R previous</span>${rf(R.rp)}</p>
<p><span class="m">ΔR% live</span><b class="${cl(dr)}">${sg(dr)}%</b></p>
<p><b class="g">LONG when R ≥ ${rf(Ru)}</b></p><p class="m">about INTER ${pf(Ru*pbv)} if BTC stays</p>
<p><b class="r">SHORT when R ≤ ${rf(Rd)}</b></p><p class="m">about INTER ${pf(Rd*pbv)} if BTC stays</p>
<hr style="border:0;border-top:1px solid var(--ln)">
<p><span class="m">Start</span>${f(A)} USDT = ${q4(A/d.pi0)} INTER at ${pf(d.pi0)}</p>
<p><span class="m">Equity</span><b class="${cl(pl)}">${f(val)}</b></p><p><span class="m">Profit / loss</span><b class="${cl(pl)}">${sg(pl)} (${sg(pl/A*100)}%)</b></p>
<p><span class="m">Closed trades</span>${sg(R.bal-A)}</p><p><span class="m">Open position</span><b class="${cl(op)}">${sg(op)}</b></p>
<p><span class="m">Winning / losing trades</span><b><span class="g">${W}</span> / <span class="r">${Ls}</span></b></p>
<p><span class="m">Just holding INTER</span>${f(A*x/d.pi0)}</p>
<p class="m">Signals use closed ${d.iv} bars from ${INT.V[INT.ex].name}. Fee 0.1% per side included. Slippage not included: INTER is thinly traded, so real fills may be worse. Not backtested.</p>`;
const jo=R.ev.map(e=>e.k).lastIndexOf("out"),rows=R.ev.map((e,j)=>{const t=new Date(e.t+INT.IV[d.iv][1]).toISOString().slice(5,16).replace("T"," ");
const ty=e.k=="out"?"Close "+(e.side>0?"long (sell ":"short (buy back ")+q4(e.q)+" INTER)":(e.side>0?"Long (buy":"Short (sell")+(e.n>1?" step "+e.n:"")+" "+q4(e.q)+" INTER)";
let rs="<td></td>";if(e.k=="out")rs=`<td class="${cl(e.pnl)}">${sg(e.pnl)} USDT (${sg(e.pnl/(e.n*A)*100)}%)</td>`;else if(j>jo&&R.side){const g=A/e.x*(L?x-e.x:e.x-x)-F*A-F*A*x/e.x;rs=`<td class="${cl(g)}">OPEN ${sg(g)} USDT (${sg(mvS(e.x,x)*100)}%)</td>`}
return `<tr><td>${t}</td><td>${ty}</td><td>${pf(e.x)}</td><td>${sg(e.d)}%</td>${rs}</tr>`}).reverse().join("");
$("tr").innerHTML="<tr><th>Time (UTC)</th><th>Action</th><th>INTER price</th><th>ΔR% that triggered it</th><th>Result</th></tr>"+(rows||"<tr><td colspan=5 class=m>No trades yet.</td></tr>");
say(`Data: ${INT.V[INT.ex].name}. Running since ${new Date(d.ts).toISOString().slice(5,16).replace("T"," ")} UTC. Updates every 3 seconds. ${R.ev.length} trade events so far.`)}
$("go").onclick=start;$("rs").onclick=()=>{localStorage.removeItem(LS);location.reload()};
if(localStorage[LS])go();
</script></body></html>
